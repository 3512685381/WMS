server:
  port: 8080

spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: wms-springboot
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/${WMS_DB_NAME:wms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: "${WMS_DB_USER:root}"
    password: "${WMS_DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

wms:
  jwt:
    secret: "${JWT_SECRET}"
    expire-seconds: 86400